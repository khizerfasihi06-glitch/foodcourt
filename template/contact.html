{% extends "base.html" %}
{% block title %}Contact — FoodOrder{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-100 rounded-xl p-6 shadow-sm">
  <h1 class="text-xl font-semibold mb-4">Get in touch</h1>
  <form method="POST" class="space-y-4">
    <input type="text" name="name" placeholder="Your name" required
           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
    <input type="text" name="number" placeholder="Phone number" required
           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
    <input type="email" name="email" placeholder="Email" required
           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
    <textarea name="message" placeholder="Message" rows="4" required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
    <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl">
      Send
    </button>
  </form>
</div>
{% endblock %}
