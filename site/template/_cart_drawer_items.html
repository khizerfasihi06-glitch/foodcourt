{% if cart_items %}
  <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3">
    {% for item in cart_items %}
    <div class="flex items-center gap-3 border-b border-gray-100 pb-3" data-cart-row="{{ item.id }}">
      <img src="{{ url_for('static', filename='images/' + item.image) }}"
           onerror="this.src='https://placehold.co/64x64?text=%F0%9F%8D%94'"
           class="w-14 h-14 rounded-lg object-cover bg-gray-100 flex-shrink-0" alt="{{ item.name }}">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-800 truncate">{{ item.name }}</p>
        <p class="text-xs text-gray-500">Rs {{ item.price }} each</p>
        <div class="flex items-center gap-2 mt-1">
          <button class="qty-btn w-6 h-6 rounded-full border border-gray-300 text-gray-600 hover:bg-gray-100"
                  onclick="updateQty({{ item.id }}, {{ item.qty - 1 }})">−</button>
          <span class="text-sm w-5 text-center">{{ item.qty }}</span>
          <button class="qty-btn w-6 h-6 rounded-full border border-gray-300 text-gray-600 hover:bg-gray-100"
                  onclick="updateQty({{ item.id }}, {{ item.qty + 1 }})">+</button>
        </div>
      </div>
      <div class="text-right flex-shrink-0">
        <p class="text-sm font-semibold text-gray-800">Rs {{ item.subtotal }}</p>
        <button class="text-xs text-red-500 hover:underline mt-1" onclick="removeFromCart({{ item.id }})">Remove</button>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="border-t border-gray-200 px-4 py-4 space-y-3">
    <div class="flex items-center justify-between text-sm text-gray-600">
      <span>Subtotal</span>
      <span class="font-semibold text-gray-900">Rs {{ cart_total }}</span>
    </div>
    <form action="{{ url_for('confirm_order') }}" method="POST">
      <button type="submit"
              class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">
        Confirm
      </button>
    </form>
  </div>
{% else %}
  <div class="flex-1 flex flex-col items-center justify-center text-gray-400 px-6 text-center">
    <span class="text-4xl mb-2">🛒</span>
    <p class="text-sm">Your cart is empty.</p>
    <p class="text-xs mt-1">Add something tasty to get started.</p>
  </div>
{% endif %}
